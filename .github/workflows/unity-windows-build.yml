name: Unity Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Unity/**"
      - ".github/workflows/unity-windows-build.yml"
      - ".github/scripts/fetch-kenney-mini-dungeon.sh"

permissions:
  contents: read

jobs:
  source-archive:
    name: Package Unity project source and CC0 models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kenney Mini Dungeon 2.0
        shell: bash
        run: bash .github/scripts/fetch-kenney-mini-dungeon.sh

      - name: Validate Unity project structure and create ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Unity/ProjectSettings/ProjectVersion.txt
          test -f Unity/Packages/manifest.json
          test -f Unity/Assets/Editor/NemesisProjectBootstrap.cs
          test -f Unity/Assets/NemesisContent/Imported/KenneyMiniDungeon/License.txt
          test "$(find "Unity/Assets/NemesisContent/Imported/KenneyMiniDungeon/Models/GLB format" -maxdepth 1 -type f -name '*.glb' | wc -l)" -eq 30
          mkdir -p dist
          zip -qr dist/Nemesis-Unity-Project.zip Unity README.md CHANGELOG.md docs .gitignore -x "Unity/Library/*" "Unity/Temp/*" "Unity/Obj/*" "Unity/Build/*" "Unity/Logs/*" "Unity/UserSettings/*"
          sha256sum dist/Nemesis-Unity-Project.zip > dist/SHA256SUMS.txt

      - name: Upload Unity source project
        uses: actions/upload-artifact@v4
        with:
          name: Nemesis-Unity-Project
          path: |
            dist/Nemesis-Unity-Project.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Nemesis for Windows x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kenney Mini Dungeon 2.0
        shell: bash
        run: bash .github/scripts/fetch-kenney-mini-dungeon.sh

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Unity
          unityVersion: 6000.0.85f2
          targetPlatform: StandaloneWindows64
          buildMethod: Nemesis.EditorTools.NemesisBuild.PerformBuild
          allowDirtyBuild: true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Nemesis-Windows-x64
          path: Unity/Build/
          if-no-files-found: error
          retention-days: 14
