name: Unity Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Unity/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".gitignore"
      - ".github/workflows/unity-windows-build.yml"

permissions:
  contents: read

jobs:
  source-archive:
    name: Validate and package Unity source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Unity project structure and asset licenses
        shell: bash
        run: |
          set -euo pipefail
          test -f Unity/ProjectSettings/ProjectVersion.txt
          test -f Unity/Packages/manifest.json
          test -f Unity/Assets/Nemesis/Editor/NemesisWorldBuilder.cs
          test -f Unity/Assets/Nemesis/Editor/NemesisDungeonSceneBuilder.cs
          test -f Unity/Assets/Nemesis/Scenes/AshenOutskirts.unity
          test -f Unity/Assets/Nemesis/Scenes/AshenDungeon.unity
          test -f Unity/Assets/ThirdParty/NemesisCatacombs/public-license.txt
          test -f Unity/Assets/ThirdParty/NemesisFreeCC0/ASSET_CREDITS.md
          test -f Unity/Assets/ThirdParty/2DPIXXWarrior/license_0.txt
          test -f Unity/ASSET_SETUP.md
          test -f Unity/Tools/Install-DarkReaperPreview.ps1
          mkdir -p dist
          zip -qr dist/Pechat-Bezdny-Unity-Source.zip Unity README.md CHANGELOG.md docs .gitignore
          sha256sum dist/Pechat-Bezdny-Unity-Source.zip > dist/SHA256SUMS.txt

      - name: Upload Unity source project
        uses: actions/upload-artifact@v4
        with:
          name: Pechat-Bezdny-Unity-Source
          path: |
            dist/Pechat-Bezdny-Unity-Source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Печать Бездны for Windows x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: Unity
          unityVersion: 6000.0.85f2
          targetPlatform: StandaloneWindows64
          buildMethod: NemesisBuild.BuildCompleteWindowsGame
          allowDirtyBuild: true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Pechat-Bezdny-Windows-x64
          path: Unity/Builds/Pechat-Bezdny-Windows/
          if-no-files-found: error
          retention-days: 14
